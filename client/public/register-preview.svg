  <!-- Tomato icon -->
  <g transform="translate(310 50)">
    <!-- tomato body -->
    <circle
      cx="0"
      cy="4"
      r="17"
      fill="#E74C3C"
    />

    <!-- soft shadow / top dip -->
    <ellipse
      cx="0"
      cy="-7"
      rx="7"
      ry="3.5"
      fill="#D94A3B"
      opacity="0.45"
    />

    <!-- calyx leaves -->
    <!-- <path
      d="M0 -10
        C-2 -12 -4 -13 -6 -12
        C-5 -10 -3 -8 -2 -6
        C-4 -7 -6 -6 -8 -4
        C-5 -4 -3 -2 -1 0
        C0 -2 2 -3 3 -4
        C5 -2 7 -2 9 -4
        C7 -5 5 -6 3 -6
        C4 -8 4 -10 2 -12
        C1 -11 0 -10 0 -10Z"
      fill="#7F9874"
    /> -->

    <path
      d="M1 -11 C4 -14 8 -15 12 -14"
      stroke="#6F8767"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- highlight -->
    <!-- <ellipse
      cx="-6"
      cy="0"
      rx="4"
      ry="7"
      fill="#FFFFFF"
      opacity="0.16"
    /> -->
  </g>

